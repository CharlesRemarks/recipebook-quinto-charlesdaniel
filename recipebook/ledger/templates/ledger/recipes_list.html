{% extends "index.html" %}

{% block content %}
<h2>List of Recipes</h2>
<ul>
    {% for recipe in object_list %}
    <li>
        <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
    </li>
    {% endfor %}
</ul>

<a href="{% url 'ledger:recipe-add' %}">Add New Recipe</a>
{% endblock %}
